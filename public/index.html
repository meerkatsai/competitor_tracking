<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competitor Tracking — AreoVeda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* tokens lifted from app.meerkats.ai */
  :root {
    --bg:#ffffff; --bg-2:#fafafa; --bg-3:#f4f4f6;
    --ink:#101827; --ink-2:#3c4754; --ink-3:#6b7380; --ink-4:#9ca3ad;
    --line:#e5e5ea; --line-2:#ededf0; --line-3:#f4f4f6;
    --accent:#ff6125; --accent-2:#ea4f10; --accent-soft:#ffe2d4; --accent-tint:#fff5ef;
    --good:#15803d; --good-bg:#f0fdf4; --bad:#dc2626; --bad-bg:#fef2f2; --warn:#a16207; --warn-bg:#fefce8;
    --font-ui:"Inter",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 28px 72px}

  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
  h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
  .ws{color:var(--ink-3);font-size:13px}
  .asof{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;padding:5px 12px;font-size:12.5px;color:var(--ink-2)}
  .asof .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
  .tile{background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:16px 18px}
  .tile .n{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .tile .n.accent{color:var(--accent-2)}
  .tile .l{font-size:12px;color:var(--ink-3);margin-top:2px}
  .tile .vs{color:var(--ink-4);font-size:13px;font-weight:500}

  /* controls: dropdowns */
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .ctl label{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-4);margin-bottom:4px}
  select.ctlsel{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 34px 8px 12px;min-width:220px;cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7380' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
  select.ctlsel:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}

  .msel{position:relative}
  .msel-btn{font:inherit;font-size:13.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 34px 8px 12px;min-width:240px;text-align:left;cursor:pointer;background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%236b7380' stroke-width='1.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
  .msel-btn:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .msel-panel{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgb(16 24 39/.12);width:280px;max-height:340px;display:flex;flex-direction:column}
  .msel-actions{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line-2)}
  .msel-list{overflow-y:auto;padding:6px}
  .msel-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink-2)}
  .msel-item:hover{background:var(--bg-2)}
  .msel-item input{accent-color:var(--accent);width:15px;height:15px;margin:0}
  .msel-item .ct{margin-left:auto;font-size:11.5px;color:var(--ink-4)}
  .linkbtn{background:none;border:none;font:inherit;font-size:12.5px;font-weight:500;color:var(--accent-2);cursor:pointer;padding:3px 8px;border-radius:6px}
  .linkbtn:hover{background:var(--accent-tint)}
  .addbtn{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border:none;border-radius:8px;font:inherit;font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer;margin-left:auto;align-self:flex-end}
  .addbtn:hover{background:var(--accent-2)}

  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:0}
  .tab{background:none;border:none;border-bottom:2px solid transparent;font:inherit;font-size:14px;font-weight:500;color:var(--ink-3);padding:9px 16px;cursor:pointer}
  .tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .tab:hover{color:var(--ink)}

  .panel{background:var(--bg);border:1px solid var(--line-2);border-top:none;border-radius:0 0 12px 12px;overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;min-width:760px;font-variant-numeric:tabular-nums}
  th{background:var(--bg-2);text-align:right;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child{text-align:left}
  td{padding:11px 16px;border-bottom:1px solid var(--line-3);text-align:right;white-space:nowrap}
  td:first-child{text-align:left;white-space:normal}
  tr:last-child td{border-bottom:none}
  tr.group td{background:var(--bg-3);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding:8px 16px;border-bottom:1px solid var(--line-2)}
  tr.ours td{background:var(--accent-tint);font-weight:600;border-bottom:1px solid var(--accent-soft)}
  tr.ours .who .b{color:var(--accent-2)}
  tr.rival:hover td{background:var(--bg-2)}
  .who{display:flex;align-items:center;gap:10px}
  .who img{width:40px;height:40px;object-fit:contain;border:1px solid var(--line-2);border-radius:8px;background:#fff;flex:none}
  .who .noimg{width:40px;height:40px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg-3);flex:none}
  .who .b{font-weight:600;display:block}
  .who .b a{color:inherit;text-decoration:none}
  .who .b a:hover{color:var(--accent-2);text-decoration:underline}
  .who .p{font-size:12px;color:var(--ink-4);display:block;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .delta{font-weight:600}
  .delta.neg{color:var(--bad)}      /* rival better for shopper = worse for us */
  .delta.pos{color:var(--good)}
  .delta.zero{color:var(--ink-4);font-weight:400}
  .muted{color:var(--ink-4)}
  .oosb{display:inline-block;font-size:10.5px;font-weight:600;background:var(--warn-bg);color:var(--warn);border-radius:5px;padding:1px 6px}
  .okb{color:var(--ink-4);font-size:12px}
  .pendb{display:inline-block;font-size:10.5px;font-weight:600;background:var(--bg-3);color:var(--ink-4);border-radius:5px;padding:1px 6px}
  .revlink{font-size:12.5px;color:var(--accent-2);cursor:pointer;font-weight:500}
  .revlink:hover{text-decoration:underline}

  /* review summary blocks (AI-generated, Amazon-style) */
  tr.sumrow td{background:var(--bg-2);border-bottom:1px solid var(--line-2);padding:12px 16px 14px;text-align:left;white-space:normal}
  tr.sumrow.oursum td{background:var(--accent-tint);border-bottom:1px solid var(--accent-soft)}
  .sum .stext{font-size:13px;color:var(--ink-2);margin-bottom:8px;max-width:78ch}
  .pcwrap{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px}
  .pc{font-size:12.5px}
  .pc .h{font-weight:600;color:var(--ink-2);margin-bottom:3px}
  .pc ul{margin:0;padding:0;list-style:none}
  .pc li{padding:1px 0;color:var(--ink-2)}
  .pc.pros li::before{content:"✓ ";color:var(--good);font-weight:700}
  .pc.cons li::before{content:"✕ ";color:var(--bad);font-weight:700}
  .themes{display:flex;flex-wrap:wrap;gap:6px}
  .theme{font-size:11.5px;font-weight:500;border-radius:999px;padding:2.5px 10px;border:1px solid var(--line)}
  .theme.positive{background:var(--good-bg);color:var(--good);border-color:#bbe3c8}
  .theme.negative{background:var(--bad-bg);color:var(--bad);border-color:#f3c4c4}
  .theme.mixed{background:var(--warn-bg);color:var(--warn);border-color:#e8d9a0}
  .ailabel{font-size:11px;color:var(--ink-4);margin-top:8px}
  .dlbtn{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink-2);padding:6px 12px;cursor:pointer;text-decoration:none;margin-left:auto}
  .dlbtn:hover{border-color:var(--accent);color:var(--accent-2)}
  .tabbar{display:flex;align-items:center;border-bottom:1px solid var(--line)}
  .tabbar .tabs{border-bottom:none;flex:1}

  .drill{border-top:1px solid var(--line-2);background:var(--bg-2);padding:16px}
  .drill h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .drill .close{float:right}
  .revgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .rev{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px}
  .rev .head{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;align-items:baseline}
  .rev .st{font-size:12.5px;font-weight:700}
  .rev .st.low{color:var(--bad)} .rev .st.high{color:var(--good)}
  .rev .t{font-weight:600;font-size:13px}
  .rev .s{color:var(--ink-2);font-size:12.5px}
  .rev .d{color:var(--ink-4);font-size:11px;margin-top:6px}

  .overlay{position:fixed;inset:0;background:rgb(16 24 39 / .45);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:var(--bg);border-radius:14px;padding:24px;width:min(440px,92vw);box-shadow:0 20px 50px rgb(16 24 39/.25)}
  .modal h2{margin:0 0 4px;font-size:16px;font-weight:600}
  .modal p.hint{margin:0 0 16px;color:var(--ink-3);font-size:12.5px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
  .field input,.field select{width:100%;font:inherit;font-size:13.5px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
  .field input:focus,.field select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .modal .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .btn2{background:var(--bg);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;font-weight:500;padding:7px 14px;cursor:pointer;color:var(--ink-2)}
  .merr{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:1em}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:10px 18px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgb(16 24 39/.3)}
  .skel{color:var(--ink-4);padding:28px;text-align:center}
  .err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:14px 16px;margin:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Competitor Tracking</h1>
    <span class="ws">AreoVeda · Amazon India</span>
    <span class="asof"><span class="dot"></span><span id="asof">loading…</span></span>
  </header>

  <div class="controls">
    <div class="ctl">
      <label>Product</label>
      <select class="ctlsel" id="prodsel"><option value="">All products</option></select>
    </div>
    <div class="ctl">
      <label>Competitors</label>
      <div class="msel" id="msel">
        <button class="msel-btn" id="mselbtn">All competitors</button>
        <div class="msel-panel" id="mselpanel" hidden>
          <div class="msel-actions">
            <button class="linkbtn" id="selall">Select all</button>
            <button class="linkbtn" id="selclear">Clear</button>
          </div>
          <div class="msel-list" id="msellist"></div>
        </div>
      </div>
    </div>
    <button class="addbtn" id="addbtn">+ Add competitor</button>
  </div>

  <div class="tabbar">
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="pricing">Pricing</button>
      <button class="tab" data-tab="reviews">Reviews</button>
    </div>
    <a class="dlbtn" href="/api/reviews.csv" download hidden id="dlreviews">⬇ Download all reviews (CSV)</a>
  </div>
  <div class="panel"><div id="panel"><div class="skel">Loading…</div></div><div id="drill"></div></div>
</div>

<div id="modalroot"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => n == null ? '—' : '₹' + Math.round(n).toLocaleString('en-IN');
const OUR = 'AreoVeda';
const amz = a => `https://www.amazon.in/dp/${encodeURIComponent(a)}`;
const who = (brand, name, asin, img) => `<div class="who">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : '<span class="noimg"></span>'}<span><span class="b"><a href="${amz(asin)}" target="_blank" rel="noopener">${esc(brand)}</a></span>${name ? `<span class="p">${esc(name)}</span>` : ''}</span></div>`;
let state = { tab: 'pricing', product: '', brands: [], selected: new Set(), battlecard: null, reviews: null, summaries: {} };

async function getJSON(url, opts) {
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ── summary ── */
async function loadSummary() {
  const s = await getJSON('/api/summary');
  $('#asof').textContent = 'Scraped ' + (s.as_of || '').slice(0, 10);
}

/* ── dropdowns ── */
async function loadBrands() {
  state.brands = await getJSON('/api/competitors');
  state.selected = new Set(state.brands.map(b => b.brand));
  renderMsel();
}
function mselLabel() {
  const n = state.selected.size, total = state.brands.length;
  $('#mselbtn').textContent = n === total ? `All competitors (${total})` : n === 0 ? 'No competitors selected' : `${n} of ${total} competitors`;
}
function renderMsel() {
  $('#msellist').innerHTML = state.brands.map(b => `
    <label class="msel-item"><input type="checkbox" data-b="${esc(b.brand)}" ${state.selected.has(b.brand) ? 'checked' : ''}>
      ${esc(b.brand)} <span class="ct">${b.pairs} product${b.pairs == 1 ? '' : 's'}</span></label>`).join('');
  document.querySelectorAll('#msellist input').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? state.selected.add(cb.dataset.b) : state.selected.delete(cb.dataset.b);
    mselLabel(); render();
  }));
  mselLabel();
}
$('#mselbtn').addEventListener('click', () => { $('#mselpanel').hidden = !$('#mselpanel').hidden; });
document.addEventListener('click', e => { if (!$('#msel').contains(e.target)) $('#mselpanel').hidden = true; });
$('#selall').addEventListener('click', () => { state.selected = new Set(state.brands.map(b => b.brand)); renderMsel(); render(); });
$('#selclear').addEventListener('click', () => { state.selected = new Set(); renderMsel(); render(); });
$('#prodsel').addEventListener('change', () => { state.product = $('#prodsel').value; render(); });

function fillProducts() {
  const opts = state.battlecard.map(p => `<option value="${esc(p.own_product)}">${esc(p.own_product)}</option>`).join('');
  $('#prodsel').innerHTML = `<option value="">All products</option>` + opts;
}

/* ── comparison tables ──
   Reference-and-delta layout: our row first (highlighted), then each rival with the
   SIGNED difference vs ours. Red = rival beats us on that column, green = we win. */
function visibleProducts() {
  return state.battlecard.filter(p => !state.product || p.own_product === state.product);
}
function rivalsOf(p) {
  return p.rivals.filter(r => state.selected.has(r.brand));
}

function priceDelta(our, theirs) {
  if (our == null || theirs == null) return '<span class="muted">—</span>';
  const d = theirs - our;
  if (Math.round(d) === 0) return '<span class="delta zero">same price</span>';
  const pct = Math.round(Math.abs(d) / our * 100);
  const amt = '₹' + Math.round(Math.abs(d)).toLocaleString('en-IN');
  return d < 0
    ? `<span class="delta neg">−${amt} · ${pct}% cheaper</span>`
    : `<span class="delta pos">+${amt} · ${pct}% pricier</span>`;
}
function ratingDelta(our, theirs) {
  if (our == null || theirs == null) return '<span class="muted">—</span>';
  const d = +(theirs - our).toFixed(1);
  if (d === 0) return '<span class="delta zero">same rating</span>';
  return d > 0 ? `<span class="delta neg">+${d.toFixed(1)}★ above us</span>`
               : `<span class="delta pos">${d.toFixed(1)}★ below us</span>`;
}
const avail = a => (a || '').toLowerCase().includes('in stock') ? '<span class="okb">in stock</span>' : '<span class="oosb">out of stock</span>';

function renderPricing() {
  const prods = visibleProducts();
  let body = '';
  for (const p of prods) {
    const rs = rivalsOf(p).slice().sort((a, b) => (a.price ?? 1e9) - (b.price ?? 1e9));
    if (prods.length > 1) body += `<tr class="group"><td colspan="4">${esc(p.own_product)}</td></tr>`;
    body += `<tr class="ours"><td>${who(OUR + ' — ' + p.own_product, '', p.own_asin, p.our_image)}</td>
      <td>${inr(p.our_price)}</td><td><span class="muted">reference</span></td><td>${avail(p.our_availability)}</td></tr>`;
    if (!rs.length) body += `<tr class="rival"><td colspan="4" class="muted">no selected competitors matched to this product</td></tr>`;
    for (const r of rs) {
      body += `<tr class="rival"><td>${who(r.brand, r.name, r.asin, r.image)}</td>
        <td>${r.pending ? '<span class="pendb">scrape queued</span>' : inr(r.price)}</td>
        <td>${r.pending ? '<span class="muted">—</span>' : priceDelta(p.our_price, r.price)}</td>
        <td>${r.pending ? '<span class="muted">—</span>' : avail(r.availability)}</td></tr>`;
    }
  }
  $('#panel').innerHTML = `<table>
    <thead><tr><th>Product / competitor</th><th>Price</th><th>Difference vs ours</th><th>Stock</th></tr></thead>
    <tbody>${body}</tbody></table>`;
  $('#drill').innerHTML = '';
}

function summaryRow(asin, isOurs, revCount, label) {
  const s = state.summaries[asin];
  const cls = isOurs ? 'sumrow oursum' : 'sumrow';
  if (!s) return `<tr class="${cls}"><td colspan="5"><div class="sum"><span class="ailabel">AI review summary pending — appears after the next analysis run.</span></div></td></tr>`;
  const pros = (s.pros || []), cons = (s.cons || []), themes = (s.themes || []);
  return `<tr class="${cls}"><td colspan="5"><div class="sum">
    <div class="stext">${esc(s.summary || '')}</div>
    <div class="pcwrap">
      ${pros.length ? `<div class="pc pros"><div class="h">Pros</div><ul>${pros.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
      ${cons.length ? `<div class="pc cons"><div class="h">Cons</div><ul>${cons.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    </div>
    ${themes.length ? `<div class="themes">${themes.map(t => `<span class="theme ${esc((t.sentiment || 'mixed').toLowerCase())}">${esc(t.label)}</span>`).join('')}</div>` : ''}
    <div class="ailabel">AI-generated from the ${s.based_on} captured review${s.based_on == 1 ? '' : 's'} · <span class="revlink" data-asin="${esc(asin)}" data-label="${esc(label)}">see all captured reviews</span></div>
  </div></td></tr>`;
}

function renderReviews() {
  const prods = visibleProducts();
  let body = '';
  for (const p of prods) {
    const rs = rivalsOf(p).slice().sort((a, b) => (b.rating ?? -1) - (a.rating ?? -1));
    if (prods.length > 1) body += `<tr class="group"><td colspan="5">${esc(p.own_product)}</td></tr>`;
    const ourLabel = OUR + ' — ' + p.own_product;
    body += `<tr class="ours"><td>${who(ourLabel, '', p.own_asin, p.our_image)}</td>
      <td>${p.our_rating ?? '—'}★</td><td><span class="muted">reference</span></td>
      <td>${p.our_reviews == null ? '—' : (+p.our_reviews).toLocaleString('en-IN')}</td>
      <td><span class="revlink" data-asin="${esc(p.own_asin)}" data-label="${esc(ourLabel)}">view all</span></td></tr>`;
    body += summaryRow(p.own_asin, true, p.our_reviews, ourLabel);
    if (!rs.length) body += `<tr class="rival"><td colspan="5" class="muted">no selected competitors matched to this product</td></tr>`;
    for (const r of rs) {
      const rLabel = r.brand + ' — vs ' + p.own_product;
      body += `<tr class="rival"><td>${who(r.brand, r.name, r.asin, r.image)}</td>
        <td>${r.pending ? '<span class="pendb">scrape queued</span>' : (r.rating ?? '—') + '★'}</td>
        <td>${r.pending ? '<span class="muted">—</span>' : ratingDelta(p.our_rating, r.rating)}</td>
        <td>${r.reviews == null ? '—' : (+r.reviews).toLocaleString('en-IN')}</td>
        <td>${r.pending ? '' : `<span class="revlink" data-asin="${esc(r.asin)}" data-label="${esc(rLabel)}">view all</span>`}</td></tr>`;
      if (!r.pending) body += summaryRow(r.asin, false, r.reviews, rLabel);
    }
  }
  $('#panel').innerHTML = `<table>
    <thead><tr><th>Product / competitor</th><th>Rating</th><th>Difference vs ours</th><th># Ratings</th><th></th></tr></thead>
    <tbody>${body}</tbody></table>`;
  $('#drill').innerHTML = '';
  document.querySelectorAll('.revlink').forEach(el => el.addEventListener('click', () => showDrill(el.dataset.asin, el.dataset.label)));
}

function showDrill(asin, label) {
  const revs = (state.reviews || []).filter(r => r.asin === asin);
  $('#modalroot').innerHTML = `<div class="overlay" id="revov">
    <div class="modal" style="width:min(760px,94vw);max-height:82vh;overflow-y:auto">
      <button class="linkbtn" style="float:right" id="revclose">close</button>
      <h2 style="margin-bottom:12px">${esc(label)}</h2>
      <p class="hint">${revs.length} captured review${revs.length === 1 ? '' : 's'} — the full history is in the CSV download.</p>
      <div class="revgrid">${revs.map(r => `
        <div class="rev">
          <div class="head"><span class="t">${esc(r.title || '')}</span>
            <span class="st ${r.stars != null && r.stars <= 3 ? 'low' : 'high'}">${r.stars ?? '—'}★</span></div>
          <div class="s">${esc(r.snippet)}</div>
          <div class="d">${esc(r.review_date || '')}</div>
        </div>`).join('') || '<div class="skel">No reviews captured for this listing yet.</div>'}
      </div>
    </div></div>`;
  $('#revclose').addEventListener('click', () => $('#modalroot').innerHTML = '');
  $('#revov').addEventListener('click', e => { if (e.target.id === 'revov') $('#modalroot').innerHTML = ''; });
}

/* ── add competitor ── */
$('#addbtn').addEventListener('click', () => {
  const prods = state.battlecard ? state.battlecard.map(p => p.own_product) : [];
  $('#modalroot').innerHTML = `<div class="overlay" id="ov">
    <div class="modal">
      <h2>Add competitor</h2>
      <p class="hint">Saved immediately; price &amp; review data appears after the next scrape run.</p>
      <div class="field"><label>Brand</label><input id="f_brand" placeholder="e.g. Mamaearth"></div>
      <div class="field"><label>Competitor product name (optional)</label><input id="f_name" placeholder="e.g. Mamaearth Baby Lotion 200ml"></div>
      <div class="field"><label>Amazon ASIN</label><input id="f_asin" placeholder="B0XXXXXXXX" maxlength="10" style="text-transform:uppercase"></div>
      <div class="field"><label>Competes with (our product)</label>
        <select id="f_own">${prods.map(p => `<option ${p === state.product ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></div>
      <div class="merr" id="merr"></div>
      <div class="row">
        <button class="btn2" id="mcancel">Cancel</button>
        <button class="addbtn" style="margin:0" id="msave">Add &amp; queue scrape</button>
      </div>
    </div></div>`;
  $('#mcancel').addEventListener('click', () => $('#modalroot').innerHTML = '');
  $('#ov').addEventListener('click', e => { if (e.target.id === 'ov') $('#modalroot').innerHTML = ''; });
  $('#msave').addEventListener('click', async () => {
    try {
      await getJSON('/api/competitors', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ brand: $('#f_brand').value.trim(), product_name: $('#f_name').value.trim(),
          asin: $('#f_asin').value.trim().toUpperCase(), own_product: $('#f_own').value }) });
      $('#modalroot').innerHTML = '';
      toast('Competitor added — scrape queued');
      await Promise.all([loadBrands(), loadData()]);
      fillProducts(); render();
    } catch (e) { $('#merr').textContent = e.message; }
  });
});
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
}

/* ── boot ── */
async function loadData() {
  let sums;
  [state.battlecard, state.reviews, sums] = await Promise.all([
    getJSON('/api/battlecard'), getJSON('/api/reviews'),
    getJSON('/api/review_summaries').catch(() => [])]);
  state.summaries = Object.fromEntries((sums || []).map(s => [s.asin, s]));
}
function render() {
  if (!state.battlecard) return;
  state.tab === 'pricing' ? renderPricing() : renderReviews();
}
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  b.classList.add('on'); state.tab = b.dataset.tab;
  $('#dlreviews').hidden = state.tab !== 'reviews';
  render();
}));
(async () => {
  try { await Promise.all([loadSummary(), loadBrands(), loadData()]); fillProducts(); render(); }
  catch (e) { $('#panel').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
